backend:
  name: github
  repo: muneasy-code/probe-website
  branch: redesign
site_url: https://deploy-preview-1--probe-lsa.netlify.app
display_url: https://deploy-preview-1--probe-lsa.netlify.app
logo_url: /probe-logo.png
media_folder: uploads
public_folder: /uploads
locale: de
collections:
- name: website
  label: Website pflegen
  files:
  - name: news
    label: Aktuelles
    file: content/news.json
    format: json
    editor:
      preview: true
    fields:
    - label: Meldungen
      name: items
      widget: list
      collapsed: true
      add_to_top: true
      summary: '{{fields.de.date}} – {{fields.de.title}}'
      label_singular: Meldung
      fields:
      - label: Deutsch
        name: de
        widget: object
        summary: '{{fields.title}}'
        fields:
        - label: Datum / Kategorie
          name: date
          widget: string
          hint: 'Zum Beispiel: 21.07.2026 oder Information'
        - label: Überschrift
          name: title
          widget: string
        - label: Text
          name: text
          widget: text
      - label: Englisch (optional)
        name: en
        widget: object
        collapsed: true
        required: false
        fields:
        - &id001
          label: Datum / Kategorie
          name: date
          widget: string
          required: false
        - &id002
          label: Überschrift
          name: title
          widget: string
          required: false
        - &id003
          label: Text
          name: text
          widget: text
          required: false
      - label: Arabisch (optional)
        name: ar
        widget: object
        collapsed: true
        required: false
        fields:
        - *id001
        - *id002
        - *id003
      - label: Russisch (optional)
        name: ru
        widget: object
        collapsed: true
        required: false
        fields:
        - *id001
        - *id002
        - *id003
      - label: Türkisch (optional)
        name: tr
        widget: object
        collapsed: true
        required: false
        fields:
        - *id001
        - *id002
        - *id003
      - label: Ukrainisch (optional)
        name: uk
        widget: object
        collapsed: true
        required: false
        fields:
        - *id001
        - *id002
        - *id003
      - label: Vietnamesisch (optional)
        name: vi
        widget: object
        collapsed: true
        required: false
        fields:
        - *id001
        - *id002
        - *id003
  - name: team
    label: Team
    file: content/team.json
    format: json
    editor:
      preview: true
    fields:
    - label: Teammitglieder
      name: members
      widget: list
      collapsed: true
      summary: '{{fields.name}} – {{fields.translations.de.role}}'
      label_singular: Teammitglied
      fields:
      - label: Name
        name: name
        widget: string
      - label: Auf Website anzeigen
        name: visible
        widget: boolean
        default: true
        required: false
      - label: Foto
        name: image
        widget: image
        hint: Am besten ein bereits passend zugeschnittenes Teamfoto hochladen.
      - label: Bildbeschreibung
        name: imageAlt
        widget: string
        required: false
      - label: Bildausschnitt (horizontal vertikal)
        name: imagePosition
        widget: string
        default: 50% 50%
        required: false
        hint: Zum Beispiel 50% 30% – Vorschau rechts prüfen.
      - label: Telefon
        name: phone
        widget: string
        required: false
      - label: E-Mail
        name: email
        widget: string
        required: false
      - label: Kontakt-Link (wenn keine E-Mail)
        name: contactUrl
        widget: string
        required: false
      - label: Texte
        name: translations
        widget: object
        fields:
        - label: Deutsch
          name: de
          widget: object
          fields:
          - label: Region
            name: region
            widget: string
          - label: Funktion / Standort
            name: role
            widget: string
          - &id004
            label: Vorstellungstext
            name: about
            widget: text
            required: false
        - label: Englisch (optional)
          name: en
          widget: object
          collapsed: true
          required: false
          fields:
          - &id005
            label: Region
            name: region
            widget: string
            required: false
          - &id006
            label: Funktion / Standort
            name: role
            widget: string
            required: false
          - *id004
        - label: Arabisch (optional)
          name: ar
          widget: object
          collapsed: true
          required: false
          fields:
          - *id005
          - *id006
          - *id004
        - label: Russisch (optional)
          name: ru
          widget: object
          collapsed: true
          required: false
          fields:
          - *id005
          - *id006
          - *id004
        - label: Türkisch (optional)
          name: tr
          widget: object
          collapsed: true
          required: false
          fields:
          - *id005
          - *id006
          - *id004
        - label: Ukrainisch (optional)
          name: uk
          widget: object
          collapsed: true
          required: false
          fields:
          - *id005
          - *id006
          - *id004
        - label: Vietnamesisch (optional)
          name: vi
          widget: object
          collapsed: true
          required: false
          fields:
          - *id005
          - *id006
          - *id004
